services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shahd-postgres
    # Credentials come from the environment (.env); the fallbacks keep a fresh clone working locally.
    # Keep DATABASE_URL in .env consistent with these three values.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shahd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shahd}
      POSTGRES_DB: ${POSTGRES_DB:-shahd}
    ports:
      # Loopback only: the database is never reachable from the LAN, whatever the password.
      - "127.0.0.1:5432:5432"
    volumes:
      - shahd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shahd} -d ${POSTGRES_DB:-shahd}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shahd_pgdata:
