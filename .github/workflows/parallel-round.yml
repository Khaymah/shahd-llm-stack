# One round of parallel training, called by train-parallel.yml (not run on its own).
#
# Every worker restores the SAME corpus snapshot (a pg_dump made once by the prepare job) and starts
# from the SAME checkpoint — round 1 from a fresh init (identical across workers: the init seed is the
# config seed), later rounds from the previous round's averaged checkpoint `Global-r<round-1>`. Each
# worker re-seeds only its batch/dropout streams (--DataSeed), trains up to step round x steps_per_round of the
# full schedule (`total_steps`, so the LR schedule is one schedule across all rounds), and uploads its
# checkpoint. The average job folds the workers into `Global-r<round>` (Scripts/AverageCheckpoints.ts).
name: Parallel training round

on:
  workflow_call:
    inputs:
      round: { type: number, required: true }
      workers: { type: string, required: true, description: "JSON array of worker indexes, e.g. [0,1,2]" }
      total_steps: { type: number, required: true }
      steps_per_round: { type: number, required: true }
      round_minutes: { type: number, required: true }
      name: { type: string, required: true }
      spec: { type: string, required: true }
      tokenizer: { type: string, required: true }
      embed: { type: number, required: true }
      layers: { type: number, required: true }
      heads: { type: number, required: true }
      batch: { type: number, required: true }

env:
  DATABASE_URL: postgres://shahd:shahd@localhost:5432/shahd

jobs:
  worker:
    name: worker ${{ matrix.worker }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false # one lost worker must not cancel the round; the average uses the survivors
      matrix:
        worker: ${{ fromJSON(inputs.workers) }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shahd
          POSTGRES_PASSWORD: shahd
          POSTGRES_DB: shahd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shahd"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-go@v5
        with:
          go-version-file: GoKernels/go.mod
      - run: bun install --frozen-lockfile

      - name: Build the Go/C FFI kernel (AVX2 with scalar fallback)
        working-directory: GoKernels/ffi
        run: go build -buildmode=c-shared -o ../matmul.dll ./

      - name: Download the corpus snapshot
        uses: actions/download-artifact@v4
        with:
          name: ParallelCorpus
          path: Runs/Corpus

      - name: Restore the corpus and the tokenizer
        run: |
          pg_restore --no-owner --no-privileges -d "$DATABASE_URL" Runs/Corpus/corpus.dump
          cp "Runs/Corpus/Tokenizer.${{ inputs.tokenizer }}.json" Data/

      - name: Previous round
        id: prev
        run: echo "round=$(( ${{ inputs.round }} - 1 ))" >> "$GITHUB_OUTPUT"

      - name: Download the previous round's averaged checkpoint
        if: inputs.round > 1
        uses: actions/download-artifact@v4
        with:
          name: Global-r${{ steps.prev.outputs.round }}
          path: Runs/Global

      - name: Register it as the run's model
        if: inputs.round > 1
        run: bun run Scripts/RegisterCheckpoint.ts --File="Runs/Global/${{ inputs.name }}.ckpt" --Name="${{ inputs.name }}"

      - name: Train this worker's segment (stops gracefully at the round time cap)
        env:
          K: ${{ matrix.worker }}
          ROUND: ${{ inputs.round }}
          MINUTES: ${{ inputs.round_minutes }}
        run: |
          UNTIL=$((ROUND * ${{ inputs.steps_per_round }}))
          mkdir -p Runs/Worker
          STOP=Runs/stop-round
          ( sleep $((MINUTES * 60)) && touch "$STOP" ) &
          bun run Scripts/TrainOnFoundry.ts --Spec="${{ inputs.spec }}" --Tokenizer="Data/Tokenizer.${{ inputs.tokenizer }}.json" \
            --EmbedDim=${{ inputs.embed }} --Layers=${{ inputs.layers }} --Heads=${{ inputs.heads }} --Batch=${{ inputs.batch }} \
            --Workers=4 --Precision=F32 --Name="${{ inputs.name }}" \
            --Steps=${{ inputs.total_steps }} --UntilStep=$UNTIL --DataSeed=$((ROUND * 100 + K)) \
            --Export="Runs/Worker/Worker-$K.ckpt" --StopFile="$STOP"
          if [ -f "$STOP" ]; then echo "::warning::worker $K hit the ${MINUTES}-minute round cap before step $UNTIL"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Worker-r${{ inputs.round }}-k${{ matrix.worker }}
          path: Runs/Worker/Worker-${{ matrix.worker }}.ckpt
          retention-days: 3
          compression-level: 1
          if-no-files-found: error

  average:
    name: average the workers
    needs: worker
    if: ${{ !cancelled() }} # average whatever workers finished
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile

      - name: Download the worker checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: Worker-r${{ inputs.round }}-k*
          merge-multiple: true
          path: Runs/Workers

      - name: Average them
        run: |
          ls -la Runs/Workers
          COUNT=$(ls Runs/Workers/*.ckpt | wc -l)
          WANT=$(echo '${{ inputs.workers }}' | jq length)
          [ "$COUNT" -ge 1 ] || { echo "::error::no worker finished round ${{ inputs.round }}"; exit 1; }
          [ "$COUNT" -eq "$WANT" ] || echo "::warning::only $COUNT of $WANT workers finished round ${{ inputs.round }}"
          bun run Scripts/AverageCheckpoints.ts --Out="Runs/Global/${{ inputs.name }}.ckpt" --Round=${{ inputs.round }} Runs/Workers/*.ckpt | tee Runs/average.txt
          { echo "### Round ${{ inputs.round }}"; echo; tail -1 Runs/average.txt; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Global-r${{ inputs.round }}
          path: Runs/Global/${{ inputs.name }}.ckpt
          retention-days: 14
          compression-level: 1
          if-no-files-found: error
