# Shahd CI — mirrors `bun run ci` (typecheck · file length · naming · lint · gradcheck · tests),
# builds the Go/C FFI kernel so the GoFfi backend is exercised, and runs the Postgres-backed store
# tests against a real pgvector service (they self-skip when DATABASE_URL is unset).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · lint · conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check:length
      - run: bun run check:naming
      - run: bun run lint

  tests:
    name: gradcheck · tests (Postgres)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shahd
          POSTGRES_PASSWORD: shahd
          POSTGRES_DB: shahd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shahd"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://shahd:shahd@localhost:5432/shahd
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-go@v5
        with:
          go-version-file: GoKernels/go.mod
      - run: bun install --frozen-lockfile
      - name: Build Go/C FFI kernel
        working-directory: GoKernels/ffi
        run: go build -buildmode=c-shared -o ../matmul.dll ./
      - run: bun run foundry:migrate
      - run: bun run gradcheck
      - run: bun test
